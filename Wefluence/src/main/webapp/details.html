<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Details</title>
  <link rel="stylesheet" href="./assets/style/styles1.css">
</head>
<body>

  <!-- Details Section -->
  <div id="details-container">
    <div id="profile-container">
      <div id="profile-picture"></div>
      <div id="profile-details">
        <h1 id="model-name">Model Name</h1>
        <p id="model-age">Age: 25</p>
        <p id="model-height">Height: 5'9"</p>
        <p id="model-weight">Weight: 130 lbs</p>
        <p id="model-city">City: New York</p>
        <p id="model-state">State: NY</p>
        <p id="model-joined">Joined: 2020</p>
        <p id="model-gender">Gender: Male</p>
        <p id="model-about">About: Lorem ipsum dolor sit amet...</p>
        <button id="book-button">Book Now</button>
      </div>
    </div>
  </div>

  <!-- Gallery Section -->
  <div id="gallery-container">
    <h2>Gallery</h2>
    <div class="gallery-grid" id="gallery-grid">
      <!-- Gallery images will be dynamically added here -->
    </div>
  </div>

  <script src="details.js"></script>
</body>
</html>
