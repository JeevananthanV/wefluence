<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model  Indepth Form</title>
  <style>
    :root {
      --txtb: rgb(0, 0, 0);
      --txtw: rgb(255, 255, 255);
      --primary-color: #191919;
      --back-color: #333333;
      --second-back-color: #666666;
      --mainheading: #ffd700;
      --subheadsimg: white;
      --paracolor: rgb(220, 220, 220);
      --mainheadfont: "Montserrat", serif;
      --subheadfont: "Montserrat", serif;
      --parafont: "Montserrat", serif;
      --white: #ffffff;
      --required-color: #ff0000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--parafont);
      color: var(--txtw);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--primary-color);
    }

    .container {
      display: flex;
      width: 80%;
      max-width: 1200px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    .form-container {
      width: 100%;
      background-color: var(--back-color);
      padding: 40px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-header h2 {
      font-size: 28px;
      color: var(--mainheading);
      font-weight: 600;
    }

    .sub-section-title {
      font-size: 22px;
      color: var(--mainheading);
      font-weight: bold;
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
      color: var(--subheadsimg);
    }

    .required-label::after {
      content: " *";
      color: var(--required-color);
    }

    .form-input, select, input[type="file"], textarea {
      margin: 16px 0;
      border: none;
      font-size: 18px;
      outline: none;
      width: 100%;
      border-bottom: 1px solid var(--white);
      background-color: transparent;
      color: var(--txtw);
    }

    .form-input::placeholder {
      color: var(--second-back-color);
    }

    select option {
      color: black;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      color: black;
      background-color: var(--white);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .submit-btn:hover {
      background-color: var(--mainheading);
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .styled-checkbox {
      display: flex;
      align-items: center;
      position: relative;
      cursor: pointer;
    }

    .styled-checkbox input[type="checkbox"] {
      appearance: none;
      width: 20px;
      height: 20px;
      background-color: var(--second-back-color);
      border: 2px solid var(--white);
      border-radius: 5px;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .styled-checkbox input[type="checkbox"]:checked {
      background-color: var(--mainheading);
      border-color: var(--mainheading);
      box-shadow: 0px 0px 5px var(--mainheading);
    }

    .styled-checkbox span {
      margin-left: 10px;
      color: var(--txtw);
      font-size: 16px;
    }

    .small-input {
      margin-left: 10px;
      border: none;
      font-size: 14px;
      width: 200px;
      border-bottom: 1px solid var(--white);
      background-color: transparent;
      color: var(--txtw);
    }

    .small-input::placeholder {
      color: var(--second-back-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-container">
      <div class="form-header">
        <h2>Model  Indepth Form</h2>
      </div>
      <form action="ModelIndepthForm" method="post" enctype="multipart/form-data">

        <!-- Personal Information Section -->
        <h3 class="sub-section-title">Personal Information Section</h3>
        <div class="form-group">
          <label for="full-name" class="required-label">Full Name:</label>
          <input type="text" id="full-name" name="fullName" class="form-input" required placeholder="Enter full name" />
        </div>
       <div class="form-group">
  <label for="dob" class="required-label">Date of Birth:</label>
  <input type="date" id="dob" name="dob" class="form-input" required />
</div>
<div class="form-group">
  <label for="age" class="required-label">Age:</label>
  <input type="number" id="age" name="age" class="form-input" required placeholder="Enter age" />
</div>
        <div class="form-group">
          <label for="gender" class="required-label">Gender:</label>
          <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Non-binary">Non-binary</option>
          </select>
        </div>
        <div class="form-group">
          <label for="contact-number" class="required-label">Contact Number:</label>
          <input type="tel" id="contact-number" name="contactNumber" class="form-input" required placeholder="Enter phone number" />
        </div>
        <div class="form-group">
          <label for="email-address" class="required-label">Email Address:</label>
          <input type="email" id="email-address" name="emailAddress" class="form-input" required placeholder="Enter email address" />
        </div>
        
<div class="form-group">
        <label for="state" class="required-label">State:</label>
        <select id="state" name="state" required>
          <option value="">Select State</option>
          
          
        </select>
      </div>

      <div class="form-group">
        <label for="city" class="required-label">City:</label>
        <select id="city" name="city" required>
          <option value="">Select City</option>
        </select>
      </div>
        <!-- Portfolio Details Section -->
        <h3 class="sub-section-title">Portfolio Details Section</h3>
        <div class="form-group">
  <label for="portfolio-photo1" class="required-label">Upload Portfolio Photo 1:</label>
  <input type="file" id="portfolio-photo1" name="portfolioPhoto1" class="form-input" accept="image/*" required />
</div>

<div class="form-group">
  <label for="portfolio-photo2" class="required-label">Upload Portfolio Photo 2:</label>
  <input type="file" id="portfolio-photo2" name="portfolioPhoto2" class="form-input" accept="image/*" required />
</div>


        <div class="form-group">
          <label for="height" class="required-label">Height:</label>
          <input type="text" id="height" name="height" class="form-input" required placeholder="Enter height" />
        </div>
        <div class="form-group">
          <label for="weight" class="required-label">Weight:</label>
          <input type="text" id="weight" name="weight" class="form-input" required placeholder="Enter weight" />
        </div>
        <div class="form-group">
          <label for="hair-color">Hair Color: (Optional)</label>
          <input type="text" id="hair-color" name="hairColor" class="form-input" placeholder="Enter hair color" />
        </div>
        <div class="form-group">
          <label for="eye-color">Eye Color: (Optional)</label>
          <input type="text" id="eye-color" name="eyeColor" class="form-input" placeholder="Enter eye color" />
        </div>
        <div class="form-group">
          <label for="skin-tone">Skin Tone: (Optional)</label>
          <input type="text" id="skin-tone" name="skinTone" class="form-input" placeholder="Enter skin tone" />
        </div>

        <!-- Experience Section -->
        <h3 class="sub-section-title">Experience Section</h3>
        <div class="form-group">
          <label for="previous-campaigns">Previous Works/Projects: (Optional)</label>
          <textarea id="previous-campaigns" name="previousWorks" class="form-input" placeholder="Describe previous campaigns or projects"></textarea>
        </div>
        <div class="form-group">
          <label for="modeling-experience" class="required-label">Modeling Experience:</label>
          <select id="modeling-experience" name="modelingExperience" required>
            <option value="">Select Experience Level</option>
            <option value="Fresher">Fresher</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Experienced">Experienced</option>
          </select>
        </div>
        <div class="form-group">
          <label>Specialized Category:</label>
          <div class="checkbox-group">
            <label class="styled-checkbox">
              <input type="checkbox" name="category[]" value="Fashion">
              <span>Fashion</span>
            </label>
            <label class="styled-checkbox">
              <input type="checkbox" name="category[]" value="Commercial">
              <span>Commercial</span>
            </label>
            <label class="styled-checkbox">
              <input type="checkbox" name="category[]" value="Fitness">
              <span>Fitness</span>
            </label>
            <label class="styled-checkbox">
              <input type="checkbox" name="category[]" value="Runway">
              <span>Runway</span>
            </label>
            <label class="styled-checkbox">
              <input type="checkbox" name="category[]" value="Other">
              <span>Other:</span>
              <input type="text" name="otherCategory" class="small-input" placeholder="Please specify">
            </label>
          </div>
        </div>

        <!-- Social Media Presence Section -->
        <h3 class="sub-section-title">Social Media Presence Section</h3>
        <div class="form-group">
          <label for="instagram-link" class="required-label">Instagram Profile Link:</label>
          <input type="text" id="instagram-link" name="instagramLink" class="form-input" required placeholder="Enter Instagram profile link" />
        </div>

        <!-- Additional Information Section -->
<h3 class="sub-section-title">Additional Information Section</h3>

<div class="form-group">
  <label for="about" class="required-label">About:</label>
  <input type="text" id="about" name="about" class="form-input" required placeholder="Tell us about yourself">
</div>
<div class="form-group">
  <label for="special-skills" class="required-label">Special Skills:</label>
  <textarea id="special-skills" name="specialSkills" class="form-input" required placeholder="Describe special skills"></textarea>
</div>

        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>
  </div>
  <script src="js/stateCityHandler.js"></script>

  <script>
    document.getElementById('portfolio-photos').addEventListener('change', function (event) {
      const fileInput = event.target;
      const errorText = document.getElementById('photo-error');

      // Validate file count
      if (fileInput.files.length > 2) {
        errorText.textContent = "Please upload only 2 photos.";
        fileInput.value = ""; // Reset the input
      } else {
        errorText.textContent = ""; // Clear error message
      }
    });
  </script>
</body>
</html>
