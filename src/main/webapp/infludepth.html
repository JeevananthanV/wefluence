<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Influencer Form</title>
  <style>
    :root {
      --txtb: rgb(0, 0, 0);
      --txtw: rgb(255, 255, 255);
      --primary-color: #191919;
      --back-color: #333333;
      --second-back-color: #666666;
      --mainheading: #ffd700;
      --subheadsimg: white;
      --paracolor: rgb(220, 220, 220);
      --mainheadfont: "Montserrat", serif;
      --subheadfont: "Montserrat", serif;
      --parafont: "Montserrat", serif;
      --white: #ffffff;
      --required-color: red;
      --optional-color: #cccccc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--parafont);
      color: var(--txtw);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--primary-color);
    }

    .container {
      display: flex;
      width: 80%;
      max-width: 1200px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    .form-container {
      width: 100%;
      background-color: var(--back-color);
      padding: 40px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-header h2 {
      font-size: 28px;
      color: var(--mainheading);
      font-weight: 600;
    }

    .sub-section-title {
      font-size: 22px;
      color: var(--mainheading);
      font-weight: bold;
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
      color: var(--subheadsimg);
    }

    .required-label::after {
      content: " *";
      color: var(--required-color);
    }

    .optional-label::after {
      content: " (optional)";
      color: var(--optional-color);
    }

    .form-input, select, textarea {
      margin: 16px 0;
      border: none;
      font-size: 18px;
      outline: none;
      width: 100%;
      border-bottom: 1px solid var(--white);
      background-color: transparent;
      color: var(--txtw);
    }

    .form-input::placeholder {
      color: var(--second-back-color);
    }

    select option {
      color: black;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      color: black;
      background-color: var(--white);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .submit-btn:hover {
      background-color: var(--mainheading);
    }

    #other-category-group {
      display: none;
    }
  </style>
  <script>
    function handleCategoryChange() {
      const categorySelect = document.getElementById("primary-category");
      const otherCategoryGroup = document.getElementById("other-category-group");
      if (categorySelect.value === "Other") {
        otherCategoryGroup.style.display = "block";
      } else {
        otherCategoryGroup.style.display = "none";
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="form-container">
      <div class="form-header">
        <h2>Influencer Form</h2>
      </div>
      <form action="InfluFullForm" method="post">

        <!-- Personal Information Section -->
        <h3 class="sub-section-title">Personal Information Section</h3>
        <div class="form-group">
          <label for="full-name" class="required-label">Full Name:</label>
          <input type="text" id="full-name" name="fullName" class="form-input" required placeholder="Enter full name" />
        </div>
        <div class="form-group">
          <label for="contact-number" class="required-label">Contact Number:</label>
          <input type="tel" id="contact-number" name="contactNumber" class="form-input" required placeholder="Enter phone number" />
        </div>
        <div class="form-group">
          <label for="email-address" class="required-label">Email Address:</label>
          <input type="email" id="email-address" name="emailAddress" class="form-input" required placeholder="Enter email address" />
        </div>
        <div class="form-group">
        <label for="gender" class="required-label">Gender:</label>
        <select id="gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="state" class="required-label">State:</label>
        <select id="state" name="state" required>
          <option value="">Select State</option>
          
          
        </select>
      </div>

      <div class="form-group">
        <label for="city" class="required-label">City:</label>
        <select id="city" name="city" required>
          <option value="">Select City</option>
        </select>
      </div>
        

        <!-- Social Media Presence Section -->
        <h3 class="sub-section-title">Social Media Presence Section</h3>
        <div class="form-group">
          <label for="instagram-handle" class="optional-label">Instagram Handle:</label>
          <input type="text" id="instagram-handle" name="instagramHandle" class="form-input" placeholder="Enter Instagram handle" />
        </div>
        <div class="form-group">
          <label for="youtube-channel" class="optional-label">YouTube Channel:</label>
          <input type="text" id="youtube-channel" name="youtubeChannel" class="form-input" placeholder="Enter YouTube channel" />
        </div>
        <div class="form-group">
          <label for="primary-category" class="required-label">Primary Content Category:</label>
          <select id="primary-category" name="primaryCategory" required onchange="handleCategoryChange()">
            <option value="">Select Category</option>
            <option value="Fashion">Fashion</option>
            <option value="Tech">Tech</option>
            <option value="Travel">Travel</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Fitness">Fitness</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group" id="other-category-group">
          <label for="other-category" class="optional-label">Please Specify:</label>
          <input type="text" id="other-category" name="otherCategory" class="form-input" placeholder="Enter your content category" />
        </div>
        <div class="form-group">
          <label for="engagement-rate" class="optional-label">Average Engagement Rate:</label>
          <input type="text" id="engagement-rate" name="engagementRate" class="form-input" placeholder="Enter average engagement rate" />
        </div>

        <!-- Monetization Preferences Section -->
        <h3 class="sub-section-title">Monetization Preferences Section</h3>
        <div class="form-group">
          <label class="required-label">Willing to Sign Long-Term Partnerships?</label>
          <label>
            <input type="radio" name="longTermPartnership" value="Yes" required /> Yes
          </label>
          <label>
            <input type="radio" name="longTermPartnership" value="No" required /> No
          </label>
        </div>

        <!-- Additional Information Section -->
        <h3 class="sub-section-title">Additional Information Section</h3>
        <div class="form-group">
          <label for="notes" class="optional-label">Notes or Requirements:</label>
          <textarea id="notes" name="notes" class="form-input" placeholder="Enter any notes or requirements"></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>
  </div>
  
  <script src="js/stateCityHandler.js"></script>
</body>
</html>
