<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Influencer Details</title>
  <link rel="stylesheet" href="./assets/style/styles1.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Your existing styles remain unchanged */
    
 :root {
  --primary: #0d6efd;
  --secondary: #6c757d;
  --accent: #495057;
  --bg-light: #f8f9fa;
  --bg-white: #ffffff;
  --text-dark: #212529;
  --radius: 12px;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  --transition: all 0.3s ease;
  --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font);
  background-color: var(--bg-light);
  color: var(--text-dark);
  line-height: 1.6;
  padding: 20px;
}

/* === Profile Details Section === */
#details-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 10px;
  background-color: var(--bg-white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: row;
  gap: 30px;
  flex-wrap: wrap;
}

#profile-container {
  display: flex;
  flex-wrap: wrap;
  width: 100%;
}

#profile-picture {
  width: 300px;
  height: 400px;
  background-color: #ccc;
  background-size: cover;
  background-position: center;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  flex-shrink: 0;
}

#profile-details {
  flex: 1;
  padding: 20px;
}

#profile-details h1 {
  font-size: 2rem;
  color: var(--primary);
  margin-bottom: 10px;
}

#profile-details p {
  margin-bottom: 8px;
  font-size: 1rem;
  color: var(--accent);
}

#book-button {
  padding: 12px 24px;
  background-color: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 1rem;
  cursor: pointer;
  margin-top: 20px;
  transition: var(--transition);
}

#book-button:hover {
  background-color: #0b5ed7;
  transform: scale(1.05);
}

/* === Gallery Section === */
#gallery-container {
  max-width: 1200px;
  margin: 40px auto;
  padding: 30px;
  background-color: var(--bg-white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

#gallery-container h2 {
  margin-bottom: 20px;
  font-size: 1.8rem;
  color: var(--accent);
  text-align: center;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.gallery-grid img {
  width: 100%;
  height: 360px;
  object-fit: cover;
  border-radius: var(--radius);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
}

.gallery-grid img:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 24px rgba(13, 110, 253, 0.2);
}

/* === Responsive Design === */
@media (max-width: 992px) {
  #details-container {
    flex-direction: column;
    align-items: center;
  }

  #profile-picture {
    width: 100%;
    height: 400px;
  }

  .gallery-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 768px) {
  .gallery-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .gallery-grid {
    grid-template-columns: 1fr;
  }
}
 
  </style>
</head>
<body>

  <div id="details-container">
    <div id="profile-container">
      <div id="profile-picture"></div>
      <div id="profile-details">
        <h1 id="model-name">Influencer Name</h1>
        <p id="model-id">Influencer ID:</p>
        <p id="model-city">City:</p>
        <p id="model-state">State:</p>
        <p id="model-gender">Gender:</p>
        <p id="model-category">Category:</p>
        <p id="model-skills">Long-term Partnership:</p>
        <p id="model-about">Notes:</p>
        <button id="book-button">Book Now</button>
      </div>
    </div>
  </div>

  <div id="gallery-container">
    <h2>Gallery</h2>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

  <script src="details_influencer.js"></script>
</body>
</html>
