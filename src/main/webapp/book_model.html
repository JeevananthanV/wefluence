<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Model Booking Form</title>
  <STYLE>
  :root{
    --txtb:rgb(0,0,0);
    --txtw:rgb(255, 255, 255);
    --primary-color:#191919;
    --back-color:#333333;
    --second-back-color:#666666;
    --mainheading:#FFD700;
    --subheadsimg:white;
    --paracolor:rgb(220, 220, 220);
    --mainheadfont:'Courier New', Courier, monospace;
    --subheadfont:'Courier New', Courier, monospace;
    --parafont:'Courier New', Courier, monospace;
    --hotpink:#e91e63;
}
/* General Body Styles */
body {
  font-family: var(--parafont);
  background: linear-gradient(155deg, #808080, #000000);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--txtw);
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Form Container Styles */
.form-container {
  max-width: 900px;
  width: 100%;
  background: linear-gradient(155deg, #000000, #808080);
  padding: 30px;
  margin: 30px;
  border-radius: 10px;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 1.1);
  overflow: auto;
}

/* Heading Styles */
h1 {
  text-align: center;
  color: var(--mainheading);
  margin-bottom: 20px;
  font-size: 2.5rem;
}

/* Form Layout */
form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* Input Group Styles */
.input-group {
  display: flex;
  flex-direction: column;
}

/* Label Styles */
label {
  font-weight: bold;
  margin-bottom: 8px;
  color: var(--txtw);
}

/* Input, Select, and Textarea Styles */
input[type="text"],input[type="tel"],
input[type="email"],
input[type="url"],
input[type="number"],
input[type="file"],
select,
textarea {
  padding: 12px;
  margin-top: 8px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background-color: #f9f9f9;
  color: var(--txtb);
  font-size: 16px;
}

/* Date Input Styles */
input[type="date"] {
  padding: 12px;
  margin-top: 8px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background-color: #f9f9f9;
  color: var(--txtb);
  font-size: 16px;
  width: 95%; /* Ensures date input fields take full width */
}

input[type="date"]:focus {
  border-color: var(--mainheading);
  outline: none;
}

/* Textarea Specific Styles */
.textarea-group {
  grid-column: span 2;
  margin-right: 20px;
}

textarea {
  resize: vertical;
  min-height: 150px;
  width: 100%;
}

/* File Input Styles */
input[type="file"] {
  padding: 8px;
  background-color: #fff;
}

/* Submit Button Styles */
button.submit-button {
  grid-column: span 2;
  background-color: var(--mainheading);
  color: var(--txtb);
  padding: 14px 24px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
  margin-top: 20px;
}

/* Submit Button Hover Effect */
button.submit-button:hover {
  background-color: var(--hotpink);
  transition: background-color 0.3s ease;
}

/* Focus and Hover Styles for Inputs */
input[type="text"]:focus,
input[type="number"]:focus,
input[type="file"]:focus,
select:focus,
textarea:focus {
  border-color: var(--mainheading);
  outline: none;
}

input[type="text"]:hover,
input[type="number"]:hover,
input[type="file"]:hover,
select:hover,
textarea:hover {
  background-color: #eaeaea;
}

/* Responsive Styles for Tablets and Smaller Screens */
@media (max-width: 768px) {
  form {
    grid-template-columns: 1fr;
  }

  .form-container {
    padding: 20px;
    width: 95%;
  }

  h1 {
    font-size: 2rem;
  }

  input[type="text"],
  input[type="number"],
  input[type="file"],
  select,
  textarea,
  input[type="date"] {
    font-size: 14px;
  }

  button.submit-button {
    padding: 12px 20px;
    font-size: 14px;
  }
}

@media (max-width: 480px) {
  h1 {
    font-size: 1.5rem;
  }

  .form-container {
    padding: 15px;
  }

  input[type="text"],
  input[type="number"],
  input[type="file"],
  select,
  textarea,
  input[type="date"] {
    font-size: 13px;
  }

  button.submit-button {
    padding: 10px 18px;
    font-size: 13px;
  }
}
  
  </STYLE>
</head>
<body>
  <div class="form-container">
    <h1>Book a Model</h1>
  <form action="ModelbookingServlet" method="POST">

    <!-- Display Model ID (disabled) -->
    <div class="input-group">
      <label for="model-id-display">Model ID</label>
      <input type="text" id="model-id-display" placeholder="Model ID" readonly disabled />
    </div>

    <!-- Hidden Model ID for submission -->
    <input type="hidden" id="model-id" name="model-id" />

    <!-- Display Model Name (disabled) -->
    <div class="input-group">
      <label for="model-name-display">Model Name</label>
      <input type="text" id="model-name-display" placeholder="Model Name" readonly disabled />
    </div>

    <!-- Hidden Model Name for submission -->
    <input type="hidden" id="model-name" name="model-name" />

    <!-- Brand Name -->
    <div class="input-group">
      <label for="brand-name">Brand Name</label>
      <input type="text" id="brand-name" name="brand-name" placeholder="Enter your brand name" required />
    </div>

    <!-- Booking Person Name -->
    <div class="input-group">
      <label for="booking-person">Your Name</label>
      <input type="text" id="booking-person" name="booking-person" placeholder="Enter your name" required />
    </div>

    <!-- Contact Email -->
    <div class="input-group">
      <label for="contact-email">Your Email</label>
      <input type="email" id="contact-email" name="contact-email" placeholder="Enter your email" required />
    </div>

    <!-- Contact Phone -->
    <div class="input-group">
      <label for="contact-phone">Your Phone Number</label>
      <input type="tel" id="contact-phone" name="contact-phone" placeholder="Enter your phone number" required />
    </div>

    <!-- Shoot Start Date -->
    <div class="input-group">
      <label for="shoot-start-date">Shoot Start Date</label>
      <input type="date" id="shoot-start-date" name="shoot-start-date" required />
    </div>

    <!-- Shoot End Date -->
    <div class="input-group">
      <label for="shoot-end-date">Shoot End Date</label>
      <input type="date" id="shoot-end-date" name="shoot-end-date" required />
    </div>

    <!-- Location -->
    <div class="input-group">
      <label for="location">Location</label>
      <input type="text" id="location" name="location" placeholder="Enter shoot location" required />
    </div>

    <!-- Shoot Duration -->
    <div class="input-group">
      <label for="duration">Shoot Duration (in hours)</label>
      <input type="number" id="duration" name="duration" min="1" placeholder="Duration" required />
    </div>

    <!-- Special Requests -->
    <div class="input-group textarea-group">
      <label for="special-requests">Special Requests</label>
      <textarea id="special-requests" name="special-requests" rows="4" placeholder="Any special requests for the shoot?"></textarea>
    </div>

    <button type="submit" class="submit-button">Book Model</button>
  </form>
</div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const modelId = urlParams.get("id") || "";
    const modelName = urlParams.get("name") || "";

    document.getElementById("model-id").value = modelId;
    document.getElementById("model-id-display").value = modelId;

    document.getElementById("model-name").value = modelName;
    document.getElementById("model-name-display").value = modelName;
  </script>
</body>
</html>
