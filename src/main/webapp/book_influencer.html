<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Influencer Booking Form</title>
  <link rel="stylesheet" href="model-form.css" />
  <STYLE>
  :root{
    --txtb:rgb(0,0,0);
    --txtw:rgb(255, 255, 255);
    --primary-color:#191919;
    --back-color:#333333;
    --second-back-color:#666666;
    --mainheading:#FFD700;
    --subheadsimg:white;
    --paracolor:rgb(220, 220, 220);
    --mainheadfont:'Courier New', Courier, monospace;
    --subheadfont:'Courier New', Courier, monospace;
    --parafont:'Courier New', Courier, monospace;
    --hotpink:#e91e63;
}
/* General Body Styles */
body {
  font-family: var(--parafont);
  background: linear-gradient(155deg, #808080, #000000);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--txtw);
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Form Container Styles */
.form-container {
  max-width: 900px;
  width: 100%;
  background: linear-gradient(155deg, #000000, #808080);
  padding: 30px;
  margin: 30px;
  border-radius: 10px;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 1.1);
  overflow: auto;
}

/* Heading Styles */
h1 {
  text-align: center;
  color: var(--mainheading);
  margin-bottom: 20px;
  font-size: 2.5rem;
}

/* Form Layout */
form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* Input Group Styles */
.input-group {
  display: flex;
  flex-direction: column;
}

/* Label Styles */
label {
  font-weight: bold;
  margin-bottom: 8px;
  color: var(--txtw);
}

/* Input, Select, and Textarea Styles */
input[type="text"],input[type="tel"],
input[type="email"],
input[type="url"],
input[type="number"],
input[type="file"],
select,
textarea {
  padding: 12px;
  margin-top: 8px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background-color: #f9f9f9;
  color: var(--txtb);
  font-size: 16px;
}

/* Date Input Styles */
input[type="date"] {
  padding: 12px;
  margin-top: 8px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background-color: #f9f9f9;
  color: var(--txtb);
  font-size: 16px;
  width: 95%; /* Ensures date input fields take full width */
}

input[type="date"]:focus {
  border-color: var(--mainheading);
  outline: none;
}

/* Textarea Specific Styles */
.textarea-group {
  grid-column: span 2;
  margin-right: 20px;
}

textarea {
  resize: vertical;
  min-height: 150px;
  width: 100%;
}

/* File Input Styles */
input[type="file"] {
  padding: 8px;
  background-color: #fff;
}

/* Submit Button Styles */
button.submit-button {
  grid-column: span 2;
  background-color: var(--mainheading);
  color: var(--txtb);
  padding: 14px 24px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
  margin-top: 20px;
}

/* Submit Button Hover Effect */
button.submit-button:hover {
  background-color: var(--hotpink);
  transition: background-color 0.3s ease;
}

/* Focus and Hover Styles for Inputs */
input[type="text"]:focus,
input[type="number"]:focus,
input[type="file"]:focus,
select:focus,
textarea:focus {
  border-color: var(--mainheading);
  outline: none;
}

input[type="text"]:hover,
input[type="number"]:hover,
input[type="file"]:hover,
select:hover,
textarea:hover {
  background-color: #eaeaea;
}

/* Responsive Styles for Tablets and Smaller Screens */
@media (max-width: 768px) {
  form {
    grid-template-columns: 1fr;
  }

  .form-container {
    padding: 20px;
    width: 95%;
  }

  h1 {
    font-size: 2rem;
  }

  input[type="text"],
  input[type="number"],
  input[type="file"],
  select,
  textarea,
  input[type="date"] {
    font-size: 14px;
  }

  button.submit-button {
    padding: 12px 20px;
    font-size: 14px;
  }
}

@media (max-width: 480px) {
  h1 {
    font-size: 1.5rem;
  }

  .form-container {
    padding: 15px;
  }

  input[type="text"],
  input[type="number"],
  input[type="file"],
  select,
  textarea,
  input[type="date"] {
    font-size: 13px;
  }

  button.submit-button {
    padding: 10px 18px;
    font-size: 13px;
  }
}
  
  </STYLE>
</head>
<body>
  <div class="form-container">
    <h1>Book an Influencer</h1>
    <form action="InfluencerBookingServlet" method="POST">
      
      <!-- Display Influencer ID (disabled) -->
      <div class="input-group">
        <label for="influencer-id-display">Influencer ID</label>
        <input type="text" id="influencer-id-display" placeholder="Influencer ID" readonly disabled />
      </div>

      <!-- Hidden Influencer ID for submission -->
      <input type="hidden" id="influencer-id" name="influencer-id" />

      <!-- Display Influencer Name (disabled) -->
      <div class="input-group">
        <label for="influencer-name-display">Influencer Name</label>
        <input type="text" id="influencer-name-display" placeholder="Influencer Name" readonly disabled />
      </div>

      <!-- Hidden Influencer Name for submission -->
      <input type="hidden" id="influencer-name" name="influencer-name" />

      <!-- Your Name -->
      <div class="input-group">
        <label for="contact-name">Your Name</label>
        <input type="text" id="contact-name" name="contact-name" required />
      </div>

      <!-- Email -->
      <div class="input-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required />
      </div>

      <!-- Phone -->
      <div class="input-group">
        <label for="phone">Your Phone Number</label>
        <input type="tel" id="phone" name="phone" required />
      </div>

      <!-- Social Media Platform -->
      <div class="input-group">
        <label for="platform">Social Media Platform</label>
        <select id="platform" name="platform" required>
          <option value="Instagram">Instagram</option>
          <option value="YouTube">YouTube</option>
          <option value="TikTok">TikTok</option>
          <option value="Facebook">Facebook</option>
          <option value="Twitter">Twitter</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- Profile Link -->
      <div class="input-group">
        <label for="profile-link">Profile Link</label>
        <input type="url" id="profile-link" name="profile-link" required />
      </div>

     

      <!-- Budget -->
      <div class="input-group">
        <label for="budget">Budget (if applicable)</label>
        <input type="number" id="budget" name="budget" min="0" />
      </div>

      <!-- Start Date -->
      <div class="input-group">
        <label for="start-date">Start Date</label>
        <input type="date" id="start-date" name="start-date" required />
      </div>

      <!-- End Date -->
      <div class="input-group">
        <label for="end-date">End Date</label>
        <input type="date" id="end-date" name="end-date" required />
      </div>

      <!-- Additional Details -->
      <div class="input-group textarea-group">
        <label for="details">Additional Details</label>
        <textarea id="details" name="details" rows="4" placeholder="Any special details or requests?"></textarea>
      </div>

      <button type="submit" class="submit-button">Book Influencer</button>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const influencerId = urlParams.get("id") || "";
    const influencerName = urlParams.get("name") || "";

    document.getElementById("influencer-id").value = influencerId;
    document.getElementById("influencer-id-display").value = influencerId;

    document.getElementById("influencer-name").value = influencerName;
    document.getElementById("influencer-name-display").value = influencerName;
  </script>
</body>
</html>
