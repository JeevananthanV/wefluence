
<h1>Homepage</h1>
<div>
  <img id="image1-display" src="default1.jpg" alt="Image 1">
  <img id="image2-display" src="default2.jpg" alt="Image 2">
  <img id="image3-display" src="default3.jpg" alt="Image 3">
</div>

<script>
    window.addEventListener("load", function() {
        // Check if images exist in localStorage
        const image1 = localStorage.getItem("image1");
        const image2 = localStorage.getItem("image2");
        const image3 = localStorage.getItem("image3");
      
        // Display the images if they exist
        if (image1) {
          document.getElementById("image1-display").src = image1;
        }
        if (image2) {
          document.getElementById("image2-display").src = image2;
        }
        if (image3) {
          document.getElementById("image3-display").src = image3;
        }
      });
      
</script>
